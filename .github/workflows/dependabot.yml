version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "ci"

    pull-request-branch-name:
      separator: "-"

    reviewers:
      - "jlezcanof"
